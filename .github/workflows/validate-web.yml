name: Validate Squared Workspace Web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/validate-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript bundle
        run: npx --yes esbuild js/app.js --bundle --platform=browser --format=esm --outfile=/tmp/squared-workspace.js
      - name: Validate service worker
        run: node --check sw.js
      - name: Validate manifest
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.webmanifest","utf8")); console.log("manifest ok")'
