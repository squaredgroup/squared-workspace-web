name: Deploy Workspace CORS Hotfix

on:
  push:
    branches: [backend]
    paths:
      - "cors-hotfix/**"
      - ".github/workflows/deploy-cors-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: squared-workspace-cors-hotfix
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HOTFIX_IMAGE: ghcr.io/${{ github.repository_owner }}/squared-workspace-api:cors-hotfix-${{ github.sha }}
      DEPLOY_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
      DEPLOY_TOKEN: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_TOKEN }}
      HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}

    steps:
      - name: Checkout backend branch
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CORS hotfix image
        uses: docker/build-push-action@v6
        with:
          context: cors-hotfix
          push: true
          tags: ${{ env.HOTFIX_IMAGE }}

      - name: Deploy to Oracle when deployment secrets are configured
        if: ${{ env.DEPLOY_URL != '' && env.DEPLOY_TOKEN != '' }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"image\":\"$HOTFIX_IMAGE\"}" \
            "$DEPLOY_URL"

      - name: Verify production readiness
        if: ${{ env.DEPLOY_URL != '' && env.DEPLOY_TOKEN != '' && env.HEALTH_URL != '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$HEALTH_URL/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready after deployment" >&2
          exit 1

      - name: Report missing deployment secrets
        if: ${{ env.DEPLOY_URL == '' || env.DEPLOY_TOKEN == '' }}
        run: |
          echo "::warning::Hotfix image was built and pushed, but Oracle deployment secrets are not configured in this repository."
