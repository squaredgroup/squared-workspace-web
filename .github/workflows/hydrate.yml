name: Hydrate Squared Workspace Web

on:
  push:
    branches: [main]
    paths:
      - "Squared%20Workspace%20Web%20-%20GitHub%20Pages.zip"
      - ".github/workflows/hydrate.yml"

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Squared Workspace Web archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Squared%20Workspace%20Web%20-%20GitHub%20Pages.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "Archive already expanded."
            exit 0
          fi
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          shopt -s dotglob nullglob
          cp -R "$TMP"/* .
          rm -f "$ZIP"
          rm -rf "$TMP"

      - name: Commit expanded web client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build complete Squared Workspace Web tree"
          git push origin HEAD:main
