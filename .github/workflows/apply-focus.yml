name: Apply reviewed Focus source edits
on:
  push:
    branches: [codex/workspace-focus-20260923]
    paths: ['scripts/apply-focus.py', 'scripts/focus-parts/**', '.github/workflows/apply-focus.yml']
permissions:
  contents: write
concurrency:
  group: apply-focus-sources
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/workspace-focus-20260923
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply hash-guarded source changes
        run: python3 scripts/apply-focus.py
      - name: Verify syntax and pure data rules
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/focus-model.test.mjs
          python3 -m py_compile tests/focus_flows.py
          git diff --check
      - name: Commit ordinary source files to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js src tests scripts/quality-budget.mjs sw.js
          git commit -m 'feat: integrate reviewed Focus mobile source changes'
          git push origin HEAD:codex/workspace-focus-20260923
      - name: Preserve inspectable source files
        uses: actions/upload-artifact@v4
        with:
          name: focus-materialized-source
          retention-days: 7
          path: |
            js
            css
            src
            tests
            scripts/quality-budget.mjs
            sw.js
