name: Deploy Squared Workspace Web
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the reproducible frontend toolchain
        run: npm ci
      - name: Type-check TypeScript foundations
        run: npm run typecheck
      - name: Validate modules and static resources
        run: npm run validate
      - name: Enforce security, accessibility and performance budgets
        run: npm run quality
      - name: Test session handling
        run: node --experimental-vm-modules --test tests/session.test.mjs
      - name: Test typed UI foundations
        run: npm run test:unit
      - name: Build and prepare the production artifact
        run: npm run build && npm run stage
      - name: Preserve inspectable production bundle
        uses: actions/upload-artifact@v4
        with:
          name: workspace-preview
          path: _site
          retention-days: 7
      - name: Install browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.63.0
          npx playwright install --with-deps chromium
      - name: Audit WCAG 2.2 AA landmarks and components
        run: npm run test:a11y
      - name: Test browser flows and keyboard accessibility
        run: |
          python3 tests/browser_smoke.py
          python3 tests/standards_smoke.py
          WORKSPACE_VISUAL_DIR=output/playwright python3 tests/product_flows.py
      - name: Preserve desktop and mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-visual-recipe
          path: output/playwright
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated application
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: artifact
      - name: Extract validated artifact
        run: mkdir cloudflare-site && tar -xf artifact/artifact.tar -C cloudflare-site
      - name: Deploy the same validated artifact to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-site --project-name=squared-workspace-web --branch=main
