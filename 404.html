<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Squared Workspace — Redirection</title>
<style>body{margin:0;background:#030503;color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{padding:32px;max-width:480px}a{color:#7be84e}</style>
</head><body><main><h1>Squared Workspace</h1><p id="status">Ouverture de votre espace…</p><a href="/">Retour à la connexion</a></main>
<script>
(function(){
  var actions={"/activation":"activation","/reinitialisation":"reset","/verification-email":"verify"};
  var path=location.pathname.replace(/\/$/,"");
  if(actions[path]){
    var source=new URLSearchParams(location.search), target=new URLSearchParams();
    ["email","token"].forEach(function(key){if(source.has(key))target.set(key,source.get(key));});
    // Move single-use credentials into a fragment: never send them to the root request.
    location.replace("/#"+path+"?"+target.toString());
  }else{document.getElementById("status").textContent="Cette page n’existe pas. Retrouvez votre espace depuis la connexion.";}
})();
</script></body></html>
